name: Auto Update Chat2API

# 自动同步上游 Chat2API-WXS 的 main 分支更新：
#   1. 定时（每天 UTC 06:00 / 北京时间 14:00）或手动触发
#   2. 查上游 main HEAD SHA，与 chat2api/build/.upstream-sha 比对
#   3. 有更新时：克隆上游 → 构建核心 → 验证产物 → 打包 fpk → 发布 Release → bump 版本 → 提交
#   4. 失败时不发布、不更新 SHA（下次仍用旧版本重试）
#
# 保留自定义改动：本地 shim/、build-inner.sh、manifest 等不在上游仓库内，天然隔离。
# 回滚：GitHub Release 保留所有历史版本；旧 .upstream-sha 不被新失败覆盖。

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制更新（跳过 SHA 比对，即使上游无变化也重新构建发布）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: auto-update-chat2api
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm-slim
    steps:
      - name: 安装系统依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential python3 make g++ pkg-config git ca-certificates jq gzip tar \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
          rm -rf /var/lib/apt/lists/*
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查上游更新
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_SHA=$(curl -sf -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/narrator-z/Chat2API-WXS/commits/main" | jq -r '.sha')
          LOCAL_SHA=$(tr -d '[:space:]' < chat2api/build/.upstream-sha 2>/dev/null || echo "")
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "local_sha=${LOCAL_SHA:-uninitialized}" >> $GITHUB_OUTPUT
          if [ "${{ inputs.force }}" = "true" ] || [ "$UPSTREAM_SHA" != "$LOCAL_SHA" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "::notice::上游有更新: $LOCAL_SHA → $UPSTREAM_SHA"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "::notice::上游无更新 ($UPSTREAM_SHA)"
          fi

      - name: 构建 Chat2API-WXS 核心
        if: steps.check.outputs.needs_update == 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          CYPRESS_INSTALL_BINARY: '0'
          SHIM_DIR: ${{ github.workspace }}/chat2api/build/shim
          SRC_DIR: /tmp/wxs
          OUT_DIR: ${{ github.workspace }}/chat2api/app/server
        run: |
          set -eu
          echo "== 克隆上游 Chat2API-WXS (main) =="
          git clone --depth 1 https://github.com/narrator-z/Chat2API-WXS.git "$SRC_DIR"
          echo "== 运行 build-inner.sh =="
          SHIM_DIR="$SHIM_DIR" SRC_DIR="$SRC_DIR" OUT_DIR="$OUT_DIR" \
            bash chat2api/build/build-inner.sh > /tmp/build.log 2>&1
          echo "== 构建产物概览 =="
          du -sh "$OUT_DIR/public" "$OUT_DIR/core" "$OUT_DIR/node_modules" 2>/dev/null || true
          echo "--- core/raw 内容 ---"
          ls -1 "$OUT_DIR/core/raw" 2>/dev/null || true

      - name: 构建失败诊断
        if: failure() && steps.check.outputs.needs_update == 'true'
        run: |
          echo "==== 关键构建日志（尾部 80 行）===="
          tail -n 80 /tmp/build.log 2>/dev/null || echo "（无日志）"
          echo "==== 环境 ===="
          node -v; npm -v; uname -a

      - name: 验证构建产物
        if: steps.check.outputs.needs_update == 'true'
        run: |
          OUT="${{ github.workspace }}/chat2api/app/server"
          # 1. electron 运行期替身（解决 require("electron") 白屏）
          [ -f "$OUT/node_modules/electron/index.js" ] || { echo "::error::electron shim 缺失"; exit 1; }
          # 2. 主进程产物
          [ -f "$OUT/core/raw/fnos-entry.js" ] || { echo "::error::fnos-entry.js 缺失"; exit 1; }
          [ -f "$OUT/core/adapter.js" ] || { echo "::error::adapter.js 缺失"; exit 1; }
          [ -f "$OUT/core/index.js" ] || { echo "::error::core/index.js 缺失"; exit 1; }
          # 3. 前端
          [ -f "$OUT/public/index.html" ] || { echo "::error::index.html 缺失"; exit 1; }
          # 4. server-entry.js 有 302 重定向（白屏修复）
          grep -q "writeHead(302" "$OUT/server-entry.js" || { echo "::error::server-entry.js 缺少 302 重定向"; exit 1; }
          # 5. node 实际 require 成功（核心可用性验证）
          node -e "
            const m = require('$OUT/core/raw/fnos-entry.js');
            if (typeof m.init !== 'function' || typeof m.dispatchIpc !== 'function') {
              console.error('FAIL: fnos-entry.js 缺少 init/dispatchIpc 导出');
              process.exit(1);
            }
            console.log('OK: exports =', Object.keys(m).join(','));
          " || { echo "::error::require(fnos-entry.js) 失败"; exit 1; }
          echo "✓ 产物完整性 + 核心可用性验证通过"

      - name: 计算新版本号
        if: steps.check.outputs.needs_update == 'true'
        id: version
        run: |
          CUR=$(jq -r '.chat2api.version' fnpack.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CUR"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "current=$CUR new=$NEW"
          echo "new_version=$NEW" >> $GITHUB_OUTPUT

      - name: 打包 fpk
        if: steps.check.outputs.needs_update == 'true'
        run: bash scripts/build_fpk.sh chat2api chat2api all

      - name: 上传产物 Artifact
        if: steps.check.outputs.needs_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chat2api-server
          path: chat2api/app/server/
          retention-days: 7
          if-no-files-found: warn

      - name: 创建 GitHub Release
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW="${{ steps.version.outputs.new_version }}"
          TAG="vchat2api-$NEW"
          UPSTREAM_SHA="${{ steps.check.outputs.upstream_sha }}"
          CHANGELOG=$(jq -r '.chat2api.changelog // ""' fnpack.json)
          gh release create "$TAG" "chat2api/chat2api_all.fpk" \
            --title "Chat2API $NEW" \
            --notes "自动同步上游 Chat2API-WXS main@${UPSTREAM_SHA:0:12}。${CHANGELOG:+

          $CHANGELOG}"

      - name: 更新版本号、size、download_url、上游 SHA、更新日志
        if: steps.check.outputs.needs_update == 'true'
        run: |
          NEW="${{ steps.version.outputs.new_version }}"
          TAG="vchat2api-$NEW"
          UPSTREAM_SHA="${{ steps.check.outputs.upstream_sha }}"
          # bump manifest version
          sed -i "s/^version\s*=.*/version               = $NEW/" chat2api/manifest
          # fpk size + download_url
          BYTES=$(stat -c%s chat2api/chat2api_all.fpk)
          SIZE_FMT=$(awk "BEGIN{printf \"%.2fKB\", $BYTES/1024}")
          REL_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/chat2api_all.fpk"
          jq --arg v "$NEW" --arg s "$SIZE_FMT" --arg u "$REL_URL" \
            '.chat2api.version=$v | .chat2api.size=$s | .chat2api.download_url=$u' \
            fnpack.json > fnpack.tmp && mv fnpack.tmp fnpack.json
          # 更新上游 SHA（验证通过后才写，失败时不写 → 下次仍用旧 SHA 重试）
          echo "$UPSTREAM_SHA" > chat2api/build/.upstream-sha
          # 更新日志
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) upstream=${UPSTREAM_SHA:0:12} version=$NEW status=success" \
            >> chat2api/build/.upstream-changelog

      - name: 提交变更
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chat2api/build/.upstream-sha chat2api/build/.upstream-changelog chat2api/manifest fnpack.json
          git commit -m "chore(chat2api): 自动同步上游 ${{ steps.check.outputs.upstream_sha }} → ${{ steps.version.outputs.new_version }} [skip ci]"
          git push

      - name: 记录失败（不更新 SHA）
        if: failure() && steps.check.outputs.needs_update == 'true'
        run: |
          UPSTREAM_SHA="${{ steps.check.outputs.upstream_sha }}"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) upstream=${UPSTREAM_SHA:0:12} version=N/A status=failed" \
            >> chat2api/build/.upstream-changelog
          echo "::warning::更新失败，SHA 未更新（$UPSTREAM_SHA），下次仍会重试"
