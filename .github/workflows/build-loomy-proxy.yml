name: Build Loomy Proxy Image

# 该应用依赖自定义镜像（Node + Playwright Chromium），必须由 CI 构建并推送到 GHCR。
# 基础镜像固定 node:20-bookworm：飞牛 fnOS 是 Debian 12（glibc 2.36），
# 用更高 glibc 的发行版构建会导致原生库在飞牛上加载失败。

on:
  push:
    paths:
      - 'loomyproxy/build/**'
      - '.github/workflows/build-loomy-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 注意：arm64 走 QEMU 模拟，构建 Chromium 依赖较慢。
      # 若只需 x86 飞牛设备，可把 platforms 改成 linux/amd64。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: loomyproxy/build
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/narrator-z/loomyproxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
