version: '3.3'
services:
  loomyproxy:
    container_name: loomyproxy
    hostname: loomyproxy
    restart: always
    # 镜像由 .github/workflows/build-loomyproxy.yml 构建并推送到 GHCR（多架构 amd64/arm64）
    image: ghcr.io/narrator-z/loomyproxy:latest
    ports:
      # TRIM_SERVICE_PORT 即 manifest 里的 service_port（19999）
      - '${TRIM_SERVICE_PORT}:19999'
    volumes:
      # 登录态（Chromium user-data-dir，含 HttpOnly 会话 Cookie）
      # 相对路径相对本 compose 文件所在目录，即 ${TRIM_APPDEST}/docker/data/loomy-profile
      - './data/loomy-profile:/data/loomy-profile'
    environment:
      # 无头运行：飞牛无图形会话，Chromium 必须 headless
      - 'LOOMY_HEADLESS=1'
      # 容器内以 root 运行 Chromium，必须关闭沙箱
      - 'LOOMY_NO_SANDBOX=1'
      - 'LOOMY_PROFILE_DIR=/data/loomy-profile'
      # 监听 0.0.0.0，端口映射才能把请求送进容器
      - 'PROXY_HOST=0.0.0.0'
      - 'PROXY_PORT=19999'
      - 'CDP_PORT=9222'
      - 'TZ=Asia/Shanghai'
      # 渲染减负开关（来自安装/升级向导，默认 0 = 关闭，行为与 1.0.x 完全一致）：
      # 置 1 后禁用软件 GPU / 光栅化 / 2D 加速画布，实测可把空闲常驻 CPU 从 25~60%（单核口径）
      # 压到 5% 以下，并消除 SwiftShader 着色器缓存的磁盘写放大。
      # 风险：若 Loomy 页面依赖 WebGL/Canvas，置 1 后可能出现界面异常，届时改回 0 即可。
      - 'LOOMY_DISABLE_GPU=${loomy_disable_gpu:-0}'
    # headless Chromium 实测常驻约 650MB、峰值 681MB，1G 上限只剩 33% 余量，
    # 一次大上下文对话就可能打满触发 OOMKill（会中断在途请求），故放宽到 1.5G。
    mem_limit: 1536m
    # 1.1.0 起每个请求打一行访问日志，这里配套轮转，避免日志无限增长
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      # 镜像内已装 curl；/v1/models 会真正走一次浏览器会话，能反映登录态与代理可用性
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19999/v1/models"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
