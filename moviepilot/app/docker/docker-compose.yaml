version: '3.3'
services:
  moviepilot:
    stdin_open: true
    tty: true
    container_name: moviepilot
    hostname: moviepilot
    network_mode: host
    volumes:
      - '${moviepilot_media_path}:/media'
      - './moviepilot-v2/config:/config'
      - './moviepilot-v2/core:/moviepilot/.cache/ms-playwright'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    environment:
      - 'NGINX_PORT=20669'
      - 'PORT=47901'
      - 'PUID=0'
      - 'PGID=0'
      - 'UMASK=000'
      - 'TZ=Asia/Shanghai'
    restart: always
    image: ghcr.io/narrator-z/moviepilot:latest
