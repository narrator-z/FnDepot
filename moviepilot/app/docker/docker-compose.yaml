version: '3.3'
services:
  moviepilot:
    stdin_open: true
    tty: true
    container_name: moviepilot
    hostname: moviepilot
    network_mode: host
    volumes:
      - '${moviepilot_media_path}:/media'
      - './moviepilot/config:/config'
      - './moviepilot/core:/moviepilot/.cache/ms-playwright'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    environment:
      - 'NGINX_PORT=20669'
      - 'PORT=47901'
      - 'PUID=0'
      - 'PGID=0'
      - 'UMASK=000'
      - 'TZ=Asia/Shanghai'
      # V3 不再用 SUPERUSER_PASSWORD 初始化密码，仅用 SUPERUSER 指明管理员用户名；
      # 真正的建号由 cmd/install_callback 调用 /api/v1/login/initialization 完成。
      - 'SUPERUSER=${moviepilot_admin_username}'
      - 'MP_ADMIN_PASSWORD=${moviepilot_admin_password}'
    restart: always
    image: ghcr.io/narrator-z/moviepilot:latest
